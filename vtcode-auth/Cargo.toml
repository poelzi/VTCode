[package]
name = "vtcode-auth"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
authors = ["Vinh Nguyen <vinhnguyen2308@gmail.com>"]
description = "Authentication and OAuth flows shared across VT Code"
license.workspace = true
readme = "README.md"
homepage = "https://github.com/vinhnx/vtcode"
repository = "https://github.com/vinhnx/vtcode"
documentation = "https://docs.rs/vtcode-auth"
keywords = ["auth", "oauth", "vtcode", "keyring"]
categories = ["authentication", "development-tools"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = "0.8"
base64 = { workspace = true }
dirs = { workspace = true }
fs2 = { workspace = true }
hostname = "0.4"
keyring-core = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
urlencoding = "2.1"
schemars = { workspace = true, optional = true, features = ["indexmap2"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# Gated behind the `dbus-secret` feature so downstreams with their own secret
# store (e.g. Tixim's tix-secrets) can drop the D-Bus backend via
# `default-features = false`.
# `crypto-rust` provides pure-Rust crypto; `vendored` (vendored OpenSSL) is
# dropped because Tixim's gateway dependency lockdown forbids `openssl` in
# Cargo.lock (rustls-only TLS policy).
dbus-secret-service-keyring-store = { version = "1.0.0", default-features = false, features = ["crypto-rust"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["user"] }

[features]
default = ["dbus-secret"]
schema = ["dep:schemars"]
# Linux/FreeBSD Secret Service (D-Bus) keyring backend. On by default for
# standalone builds; disable it when embedding a different secret store.
dbus-secret = ["dep:dbus-secret-service-keyring-store"]

[dev-dependencies]
assert_fs = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true

